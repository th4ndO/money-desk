<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5262ec"/>
      <stop offset="1" stop-color="#2d38b0"/>
    </linearGradient>
  </defs>
  <!-- Full-bleed square: iOS and Android round or mask the corners themselves. -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- Envelope, kept inside the central safe zone so masks never clip it. -->
  <rect x="96" y="146" width="320" height="228" rx="30" fill="#ffffff"/>
  <path d="M110 164 L256 272 L402 164" fill="none" stroke="#c9cff7" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Wax seal with the rand sign. -->
  <circle cx="256" cy="274" r="72" fill="#2d38b0" stroke="#ffffff" stroke-width="13"/>
  <text x="256" y="303" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="84" fill="#ffffff">R</text>
</svg>
